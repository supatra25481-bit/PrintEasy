<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRINT EASY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🖨️ PRINT EASY</h1>

    <p class="subtitle">
        อัปโหลดไฟล์เพื่อสั่งปริ้น
    </p>


    <!-- อัปโหลดไฟล์ -->

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept=".pdf"
        >

        <label for="fileInput">
            📤 เลือกไฟล์ PDF
        </label>

        <p id="fileName">
            ยังไม่ได้เลือกไฟล์
        </p>

        <p id="pageCount"></p>

    </div>


    <!-- ตั้งค่าการปริ้น -->

    <div id="printSetting">

        <h2>⚙️ ตั้งค่าการปริ้น</h2>


        <!-- ขนาดกระดาษ -->

        <div class="setting">

            <label>
                📄 ขนาดกระดาษ
            </label>

            <select id="paperSize">

                <option value="A4">
                    A4
                </option>

                <option value="A5">
                    A5
                </option>

            </select>

        </div>


        <!-- ประเภท A5 -->

        <div
            class="setting"
            id="a5TypeBox"
            style="display:none;"
        >

            <label>
                📦 ประเภท A5
            </label>

            <select id="a5Type">

                <option value="document">
                    เอกสาร
                </option>

                <option value="card">
                    การ์ด
                </option>

                <option value="sticker">
                    สติกเกอร์
                </option>

            </select>

        </div>


        <!-- สี -->

        <div class="setting">

            <label>
                🎨 สีของงาน
            </label>

            <select id="color">

                <option value="black">
                    ขาวดำ
                </option>

                <option value="color">
                    สี
                </option>

            </select>

        </div>


        <!-- จำนวนชุด -->

        <div class="setting">

            <label>
                🔢 จำนวนชุด
            </label>

            <input
                type="number"
                id="copies"
                value="1"
                min="1"
            >

        </div>


        <!-- ราคา -->

        <div class="price-box">

            <p>ราคาทั้งหมด</p>

            <h2 id="price">
                0 บาท
            </h2>

        </div>


        <!-- ปุ่มยืนยัน -->

        <button
            id="printButton"
            class="print-button"
        >

            🖨️ ยืนยันคำสั่งปริ้น

        </button>


        <p id="status"></p>

    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="script.js"></script>

</body>

</html>
