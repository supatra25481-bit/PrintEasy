<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRINT EASY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🖨️ PRINT EASY</h1>

    <p class="subtitle">
        อัปโหลดไฟล์เพื่อสั่งปริ้น
    </p>


    <!-- =========================
         อัปโหลดไฟล์
    ========================== -->

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept=".pdf,application/pdf"
        >

        <label for="fileInput">
            📤 เลือกไฟล์ PDF
        </label>

        <p id="fileName">
            ยังไม่ได้เลือกไฟล์
        </p>

        <p id="pageCount"></p>

    </div>


    <!-- =========================
         ตั้งค่าการปริ้น
    ========================== -->

    <div
        id="printSetting"
        style="display:none;"
    >

        <h2>⚙️ ตั้งค่าการปริ้น</h2>


        <!-- ขนาดกระดาษ -->

        <div class="setting">

            <label for="paperSize">
                📄 ขนาดกระดาษ
            </label>

            <select id="paperSize">

                <option value="A4">
                    A4
                </option>

                <option value="A5">
                    A5
                </option>

            </select>

        </div>


        <!-- ประเภท A5 -->

        <div
            class="setting"
            id="a5TypeBox"
            style="display:none;"
        >

            <label for="a5Type">
                📦 ประเภท A5
            </label>

            <select id="a5Type">

                <option value="document">
                    เอกสาร
                </option>

                <option value="card">
                    การ์ด
                </option>

                <option value="sticker">
                    สติกเกอร์
                </option>

            </select>

        </div>


        <!-- สี -->

        <div class="setting">

            <label for="color">
                🎨 สีของงาน
            </label>

            <select id="color">

                <option value="black">
                    ขาวดำ
                </option>

                <option value="color">
                    สี
                </option>

            </select>

        </div>


        <!-- จำนวนชุด -->

        <div class="setting">

            <label for="copies">
                🔢 จำนวนชุด
            </label>

            <input
                type="number"
                id="copies"
                value="1"
                min="1"
            >

        </div>


        <!-- =========================
             ราคาทั้งหมด
        ========================== -->

        <div class="price-box">

            <p>
                ราคาทั้งหมด
            </p>

            <h2 id="price">
                0 บาท
            </h2>

        </div>


        <!-- =========================
             ปุ่มปริ้น
        ========================== -->

        <button
            type="button"
            id="printButton"
            class="print-button"
        >

            🖨️ ยืนยันคำสั่งปริ้น

        </button>


        <p id="status"></p>

    </div>


    <!-- =========================
         หน้าชำระเงิน
    ========================== -->

    <div
        id="paymentBox"
        style="display:none;"
    >

        <h2>
            💳 ชำระเงิน
        </h2>

        <p>
            กรุณาสแกน QR Code
            เพื่อชำระค่าปริ้น
        </p>


        <!-- สรุปงาน -->

        <div id="summary"></div>


        <!-- QR Code -->

        <div id="qrcode"></div>


        <p class="payment-note">

            หลังจากชำระเงินแล้ว
            กดปุ่มด้านล่าง

        </p>


        <button
            type="button"
            id="paidButton"
            class="print-button"
        >

            ✅ ชำระเงินแล้ว

        </button>

    </div>


    <!-- =========================
         หน้าสำเร็จ
    ========================== -->

    <div
        id="successBox"
        style="display:none;"
    >

        <h2>
            ✅ รับคำสั่งปริ้นแล้ว
        </h2>

        <p>
            กรุณานำใบเสร็จหรือหน้าจอนี้
            มาแสดงที่จุดปริ้น
        </p>

    </div>

</div>


<!-- =========================
     Library
========================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- =========================
     JavaScript ของเรา
========================== -->

<script src="script.js"></script>

</body>

</html>
